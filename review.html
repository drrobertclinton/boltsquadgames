<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Bolt Squad Review</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
:root{--bg:#04111e;--panel:#0c2840;--line:#24506b;--fg:#e8f4f8;--muted:#8fb6c7;--sun:#ffd166;--kelp:#3ad1b8;--danger:#ff4d6d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:500 15px 'Chakra Petch',system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1{font:400 clamp(24px,5vw,34px) Bungee,sans-serif;color:var(--sun);margin:0}
h2{font:400 18px Bungee,sans-serif;margin:0 0 10px;color:var(--kelp)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
button{font:700 14px 'Chakra Petch',sans-serif;border-radius:10px;border:2px solid var(--line);background:#123653;color:var(--fg);padding:9px 14px;cursor:pointer}
button.ok{background:var(--kelp);border-color:var(--kelp);color:#032a24}
button.no{background:var(--danger);border-color:var(--danger);color:#2a0510}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:#081a2a;border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#000}
.card .meta{font-size:12px;color:var(--muted)}
.card .row{display:flex;gap:6px;flex-wrap:wrap}
.flag{color:var(--danger);font-weight:700}
.ideas{display:grid;gap:8px}
.idea{background:#081a2a;border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:4px}
.idea .meta{font-size:12px;color:var(--muted)}
.empty{color:var(--muted)}
#who{color:var(--muted);font-size:13px}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><h1>Bolt Squad Review</h1><div><span id="who"></span> <button id="signout" hidden>Sign out</button></div></div>
  <section id="login"><h2>Sign in</h2><div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><input id="email" type="email" value="robert@vilasi.co" aria-label="Email" style="font:inherit;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:#081a2a;color:var(--fg);min-width:240px"><button id="sendLink" class="ok">Email me a sign-in link</button><span class="empty">or</span><button id="signin">Sign in with Google</button></div><p class="empty" id="linkMsg" style="margin:8px 0 0"></p></section>
  <p id="msg" class="empty">Only Robert's accounts can use this page.</p>
  <section id="secReported" hidden><h2>Reported pictures</h2><div class="grid" id="reported"></div></section>
  <section id="secPending" hidden><h2>Pictures waiting for approval</h2><div class="grid" id="pending"></div></section>
  <section id="secApproved" hidden><h2>Approved pictures</h2><div class="grid" id="approved"></div></section>
  <section id="secLb" hidden><h2>Leaderboard players</h2><p class="empty" style="margin:0 0 8px">Remove takes a player off today, this week, this month and all time.</p><button class="no" id="lbBots" hidden style="margin-bottom:10px">Remove all test bots</button><div class="ideas" id="lbAdmin"></div></section>
  <section id="secIdeas" hidden><h2>Idea Box</h2><div class="ideas" id="ideas"></div></section>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAWYvqOJkjm1zXFGVJmnnu7kUYF9fLbfSE",authDomain:"bolt-squad.firebaseapp.com",projectId:"bolt-squad",appId:"1:294046723169:web:74598fa66c27edc30f8e20"});
const auth=firebase.auth(),db=firebase.firestore(),$=s=>document.querySelector(s);
const ADMINS=['drrobertclinton@gmail.com','robert@vilasi.co'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=ts=>ts&&ts.toDate?ts.toDate().toLocaleString():'';
$('#signin').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{$('#msg').textContent='Sign-in did not finish: '+e.message});
$('#signout').onclick=()=>auth.signOut();
const linkSettings={url:location.origin+location.pathname,handleCodeInApp:true};
$('#sendLink').onclick=async()=>{const em=$('#email').value.trim().toLowerCase();if(!em)return;try{await auth.sendSignInLinkToEmail(em,linkSettings);try{localStorage.setItem('bsReviewEmail',em)}catch(e){}$('#linkMsg').textContent='Check '+em+' for a sign-in link. Open it on this same device.'}catch(e){$('#linkMsg').textContent='Could not send the link: '+e.message}};
if(auth.isSignInWithEmailLink(location.href)){let em=null;try{em=localStorage.getItem('bsReviewEmail')}catch(e){}em=em||$('#email').value.trim();auth.signInWithEmailLink(em,location.href).then(()=>history.replaceState(null,'',location.pathname)).catch(e=>{$('#linkMsg').textContent='That link did not work: '+e.message})}
function lbKeys(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const[y,m,d]=p.split('-').map(Number),dt=new Date(Date.UTC(y,m-1,d)),dow=(dt.getUTCDay()+6)%7;dt.setUTCDate(dt.getUTCDate()-dow+3);const wy=dt.getUTCFullYear(),jan4=new Date(Date.UTC(wy,0,4)),wk=1+Math.round(((dt-jan4)/864e5-3+((jan4.getUTCDay()+6)%7))/7);return['lb_day_'+p,'lb_week_'+wy+'-W'+String(wk).padStart(2,'0'),'lb_month_'+p.slice(0,7),'lb_all']}
auth.onAuthStateChanged(u=>{
  const ok=u&&ADMINS.includes((u.email||'').toLowerCase());$('#login').hidden=!!u;
  $('#signin').hidden=!!u;$('#signout').hidden=!u;$('#who').textContent=u?u.email:'';
  ['#secReported','#secPending','#secApproved','#secLb','#secIdeas'].forEach(s=>$(s).hidden=!ok);
  $('#msg').textContent=!u?"Only Robert's accounts can use this page.":ok?'Approve a picture only if it is safe for kids. Deny anything with a real child\'s face, words, or anything you would not show a 10-year-old.':'This account cannot review pictures.';
  if(ok)load();
});
async function setStatus(id,ver,status,clearReports){
  const b=db.batch(),u={status};if(clearReports)u.reports=0;
  b.update(db.collection('faces').doc(id),u);
  b.set(db.collection('faceStatus').doc(id),{status,ver});
  await b.commit();load();
}
function card(d,mode){
  const f=d.data(),el=document.createElement('div');el.className='card';
  el.innerHTML=`<img alt="Picture from ${esc(f.name)}" src="${esc(f.img)}"><div><b>${esc(f.name)}</b><div class="meta">${when(f.at)}${f.reports?` · <span class="flag">${f.reports} report${f.reports>1?'s':''}</span>`:''}</div></div><div class="row"></div>`;
  const row=el.querySelector('.row'),btn=(t,c,fn)=>{const b=document.createElement('button');b.textContent=t;if(c)b.className=c;b.onclick=async()=>{b.disabled=true;try{await fn()}catch(e){alert(e.message)}};row.appendChild(b)};
  if(mode!=='approved')btn('Approve','ok',()=>setStatus(d.id,f.ver,'approved',true));
  if(mode==='reported')btn('Keep showing','ok',()=>setStatus(d.id,f.ver,'approved',true));
  btn(mode==='approved'?'Take down':'Deny','no',()=>setStatus(d.id,f.ver,'denied',false));
  return el;
}
async function load(){
  const all=await db.collection('faces').get();
  const rep=[],pen=[],app=[];
  all.forEach(d=>{const f=d.data();if(f.status==='denied'||d.id.startsWith('zztest'))return;if(f.reports>0)rep.push(d);else if(f.status==='pending')pen.push(d);else if(f.status==='approved')app.push(d)});
  const fill=(box,list,mode,emptyText)=>{box.innerHTML='';list.sort((a,b)=>(b.data().at?.seconds||0)-(a.data().at?.seconds||0)).forEach(d=>box.appendChild(card(d,mode)));if(!list.length)box.innerHTML=`<p class="empty">${emptyText}</p>`};
  fill($('#reported'),rep,'reported','Nothing reported.');fill($('#pending'),pen,'pending','No pictures waiting.');fill($('#approved'),app,'approved','None approved yet.');
  const lb=await db.collection('lb_all').orderBy('coins','desc').limit(200).get(),la=$('#lbAdmin');la.innerHTML='';
  lb.forEach(d=>{const f=d.data(),el=document.createElement('div');el.className='idea';el.innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span><b>${esc(f.name)}</b> · ${(f.coins||0).toLocaleString()} coins</span><button class="no">Remove</button></div><div class="meta">Last game ${when(f.at)} · id ${esc(d.id)}</div>`;
    el.querySelector('button').onclick=async e=>{e.target.disabled=true;const b=db.batch();lbKeys().forEach(k=>b.delete(db.collection(k).doc(d.id)));await b.commit();el.remove()};la.appendChild(el)});
  // Claude's play-test robots all used the name Sparky
  const bots=lb.docs.filter(d=>d.data().name==='Sparky'),bb=$('#lbBots');bb.hidden=!bots.length;bb.textContent='Remove all test bots ('+bots.length+')';
  bb.onclick=async()=>{bb.disabled=true;for(let i=0;i<bots.length;i+=100){const b=db.batch();bots.slice(i,i+100).forEach(d=>lbKeys().forEach(k=>b.delete(db.collection(k).doc(d.id))));await b.commit()}bb.disabled=false;load()};
  if(!la.children.length)la.innerHTML='<p class="empty">No players yet.</p>';
  const ideas=await db.collection('ideas').orderBy('at','desc').limit(200).get();
  const ib=$('#ideas');ib.innerHTML='';
  ideas.forEach(d=>{const f=d.data();if(d.id==='test-setup-1')return;const el=document.createElement('div');el.className='idea';el.innerHTML=`<div>${esc(f.text)}</div><div class="meta">${esc(f.from)} · ${when(f.at)}</div>`;ib.appendChild(el)});
  if(!ib.children.length)ib.innerHTML='<p class="empty">No ideas yet.</p>';
}
</script>
</body>
</html>
